services:
  api-gateway:
    build:
      context: .
      target: api-gateway
    ports:
      - 3000:3000
    image: skyops/api-gateway
  flight:
    build:
      context: .
      target: flight
    ports:
      - 3001:3001
    image: skyops/flight
  document:
    build:
      context: .
      target: document
    ports:
      - 3002:3002
    image: skyops/document
  web:
    build:
      context: .
      target: web
    ports:
      - 8080:8080
    image: skyops/web
  db:
    image: postgres:18
    container_name: postgres-dev
    volumes:
      - ./postgres-default.conf:/etc/postgresql/postgresql.conf
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "timezone=UTC",
      ]
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.utf8"
      TZ: UTC
    ports:
      - "5433:5432"

volumes:
  postgres_data:
