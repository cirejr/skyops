services:
  api-gateway:
    build:
      context: .
      target: api-gateway
    ports:
      - 3000:3000
    image: skyops/api-gateway
    networks:
      - skyops-net
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}

  flight:
    build:
      context: .
      target: flight
    ports:
      - 3001:3001
    image: skyops/flight
    networks:
      - skyops-net
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}

  document:
    build:
      context: .
      target: document
    ports:
      - 3002:3002
    image: skyops/document
    networks:
      - skyops-net
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}

  web:
    build:
      context: .
      target: web
    ports:
      - 5173:8080
    image: skyops/web
    depends_on:
      - api-gateway

  db:
    image: postgres:18
    container_name: postgres-dev
    volumes:
      - ./postgres-default.conf:/etc/postgresql/postgresql.conf
      - ./database/init-db:/docker-entrypoint-initdb.d
      - skyops_data:/var/lib/postgresql
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.utf8"
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - skyops-net

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - 8080:80

volumes:
  skyops_data:
  pgadmin_data:

networks:
  skyops-net:
    driver: bridge
