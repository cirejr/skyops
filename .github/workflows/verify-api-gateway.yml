name: API Gateway Verification CI

on:
  push:
    paths:
      - "apps/api-gateway/**"
      - "packages/configs/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-api-gateway.yml"
      - "eslint.config.ts"
      - ".prettierrc"
      - ".npmrc"
      - ".prettierignore"
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.*.json"

  pull_request:
    paths:
      - "apps/api-gateway/**"
      - "packages/configs/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-api-gateway.yml"
      - "eslint.config.ts"
      - ".prettierrc"
      - ".npmrc"
      - ".prettierignore"
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.*.json"

permissions:
  contents: read

jobs:
  verify-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - run: echo ' The repo {{github.repository }} has been cloned to the runner.'

      - run: echo 'The workflow is now ready to test the code'
      - run: echo " The verify-application job's status is {{job.status}} "

      - name: Install pnpm (node included) # Node version is picked up in the package.json's devEngines.runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install deps
        run: pnpm ci

      - name: run verification script
        run: pnpm --filter api-gateway verify
