name: Document Verification CI

on:
  push:
    paths:
      - "apps/document/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-document.yml"
      - "eslint.config.ts"
      - ".prettierrc"
      - ".npmrc"
      - ".prettierignore"
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.*.json"

  pull_request:
    paths:
      - "apps/document/**"
      - "packages/configs/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-document.yml"
      - "eslint.config.ts"
      - ".prettierrc"
      - ".npmrc"
      - ".prettierignore"
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.*.json"

permissions:
  contents: read

jobs:
  verify-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm (node included) # Node version is picked up in the package.json's devEngines.runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install deps
        run: pnpm ci

      - name: run verification scrip
        run: pnpm --filter document verify
