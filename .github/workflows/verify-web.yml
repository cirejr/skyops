name: Web app Verification CI

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/configs/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-web.yml"

  pull_request:
    paths:
      - "apps/web/**"
      - "packages/configs/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-web.yml"

permissions:
  contents: read

jobs:
  verify-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm (Node included) # Node version is picked up in the package.json's devEngines.runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Verify scrip
        run: pnpm --filter web verify
